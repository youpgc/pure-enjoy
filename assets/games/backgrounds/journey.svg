<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160">
  <!-- 西行·大厅氛围底：远山剪影 + 祥云 + 西行足迹 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1E14"/>
      <stop offset="1" stop-color="#4A2B12"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6E3B4"/>
      <stop offset="1" stop-color="#B98F3E"/>
    </linearGradient>
  </defs>
  <rect width="480" height="160" fill="url(#sky)"/>
  <!-- 远山三层剪影 -->
  <path d="M0 128 L60 92 L110 118 L170 78 L235 122 L300 88 L360 120 L420 96 L480 124 L480 160 L0 160 Z" fill="#1A1210" opacity="0.75"/>
  <path d="M0 140 L80 112 L150 136 L230 104 L310 138 L390 112 L480 138 L480 160 L0 160 Z" fill="#120D0A" opacity="0.9"/>
  <!-- 圆月 -->
  <circle cx="392" cy="44" r="24" fill="#F6E3B4" opacity="0.85"/>
  <circle cx="392" cy="44" r="30" fill="none" stroke="#E8C470" stroke-width="1.2" opacity="0.5"/>
  <!-- 祥云（鎏金线条） -->
  <g stroke="url(#gold)" stroke-width="1.6" fill="none" opacity="0.8" stroke-linecap="round">
    <path d="M36 44 q10 -14 24 -8 q6 -12 20 -8 q12 2 12 12 q12 0 10 10"/>
    <path d="M250 84 q8 -10 18 -6 q5 -9 15 -5 q9 2 9 9 q9 0 8 8"/>
    <path d="M120 96 q7 -9 16 -5 q4 -8 13 -4 q8 2 8 8 q8 0 7 7"/>
  </g>
  <!-- 西行脚印（左向足迹，指向西） -->
  <g fill="#E8C470" opacity="0.55">
    <ellipse cx="330" cy="136" rx="5" ry="2.6" transform="rotate(-12 330 136)"/>
    <ellipse cx="312" cy="142" rx="5" ry="2.6" transform="rotate(-10 312 142)"/>
    <ellipse cx="294" cy="147" rx="4.4" ry="2.3" transform="rotate(-8 294 147)"/>
    <ellipse cx="278" cy="151" rx="4" ry="2.1" transform="rotate(-6 278 151)"/>
  </g>
  <!-- 星点 -->
  <g fill="#F6E3B4" opacity="0.7">
    <circle cx="80" cy="28" r="1.4"/>
    <circle cx="180" cy="20" r="1.1"/>
    <circle cx="300" cy="34" r="1.2"/>
    <circle cx="440" cy="80" r="1.0"/>
  </g>
</svg>
