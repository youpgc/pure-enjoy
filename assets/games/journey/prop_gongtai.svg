<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- 香火供台（可破坏参照物）：木案 + 香炉，击碎后掉落 -->
  <rect x="6" y="30" width="36" height="6" rx="2" fill="#8A5A3B"/>
  <rect x="9" y="36" width="5" height="8" rx="1.5" fill="#6E452B"/>
  <rect x="34" y="36" width="5" height="8" rx="1.5" fill="#6E452B"/>
  <rect x="6" y="27" width="36" height="4" rx="2" fill="#B07C5A"/>
  <!-- 香炉 -->
  <ellipse cx="24" cy="20" rx="9" ry="7" fill="#4A3220"/>
  <ellipse cx="24" cy="17" rx="9" ry="5" fill="#6E452B"/>
  <ellipse cx="24" cy="16" rx="6" ry="3" fill="#2B1C10"/>
  <!-- 香签与火点 -->
  <line x1="21" y1="14" x2="19" y2="6" stroke="#B07C5A" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="24" y1="13" x2="24" y2="4" stroke="#B07C5A" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="27" y1="14" x2="29" y2="6" stroke="#B07C5A" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="19" cy="5.5" r="1.4" fill="#E8C470"/>
  <circle cx="24" cy="3.5" r="1.4" fill="#F6E3B4"/>
  <circle cx="29" cy="5.5" r="1.4" fill="#E8C470"/>
  <!-- 供果 -->
  <circle cx="12" cy="24" r="2.4" fill="#D4813F"/>
  <circle cx="36" cy="24" r="2.4" fill="#C9583F"/>
</svg>
