<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 西行·游戏图标：鎏金紧箍 + 西行方向星 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6E3B4"/>
      <stop offset="1" stop-color="#B98F3E"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#2A1E14"/>
  <!-- 紧箍（双环带尖） -->
  <g fill="none" stroke="url(#g)" stroke-linecap="round">
    <ellipse cx="32" cy="26" rx="17" ry="9" stroke-width="3.4"/>
    <ellipse cx="32" cy="33" rx="17" ry="9" stroke-width="2.2" opacity="0.85"/>
  </g>
  <!-- 环上尖刺 -->
  <g fill="url(#g)">
    <path d="M15 26 l-3.4 -1.8 1 3.4 z"/>
    <path d="M49 26 l3.4 -1.8 -1 3.4 z"/>
    <path d="M15 33 l-3.4 1.8 1 -3.4 z" opacity="0.85"/>
    <path d="M49 33 l3.4 1.8 -1 -3.4 z" opacity="0.85"/>
  </g>
  <!-- 云与星 -->
  <path d="M18 47 q5 -6 11 -3 q3 -6 10 -3 q6 2 5 7" fill="none" stroke="#E8C470" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
  <circle cx="47" cy="49" r="2" fill="#F6E3B4"/>
  <circle cx="13" cy="14" r="1.4" fill="#F6E3B4" opacity="0.8"/>
  <circle cx="52" cy="12" r="1.1" fill="#F6E3B4" opacity="0.7"/>
</svg>
